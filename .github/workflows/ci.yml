name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.14']
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked --extra dev
      - run: make ci
      - name: Test installed wheel
        run: |
          uv venv /tmp/pyppann-wheel
          uv pip install --python /tmp/pyppann-wheel/bin/python dist/*.whl pytest
          cd /tmp
          /tmp/pyppann-wheel/bin/python -m pytest "$GITHUB_WORKSPACE/tests" --import-mode=importlib -q

  gate:
    if: always()
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          TEST_RESULT: ${{ needs.test.result }}
        run: test "$TEST_RESULT" = success
